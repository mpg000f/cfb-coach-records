name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "gen_pages.py", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Weekly data refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate per-coach pages + sitemap
        run: python3 gen_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
